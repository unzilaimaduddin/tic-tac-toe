<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe Game</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="./favicon.png">

</head>

<body>

    <div class="msg-container hide">
        <p id="msg">Winner</p>
        <button id="new-button">New Game</button>
    </div>
    <main>
        <h1>Tic Tac Toe</h1>
        <div class="scoreboard">
            <div class="score-box">
                <p class="score-label">Player X</p>
                <p id="score-x" class="score-value playerX">0</p>
            </div>
            <div class="score-box">
                <p class="score-label">Draw</p>
                <p id="score-draw" class="score-value">0</p>
            </div>
            <div class="score-box">
                <p class="score-label">Player O</p>
                <p id="score-o" class="score-value playerO">0</p>
            </div>
        </div>

        <div class="container">
            <div class="game">

                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <div class="strike-line hide" id="strike-line"></div>
            </div>
        </div>
        <button id="reset-button">Reset Game</button>
    </main>
    <script src="app.js"></script>
</body>

</html>
